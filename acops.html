<!DOCTYPE html>
<html>

<head>
    <title>ACOPS.KR</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        @font-face {
            font-family: "SB";
            src: url('files/font/SBL.ttf') format(truetype);
        }

        a {
            color: rgb(255, 255, 255);
            cursor: pointer;
        }

        body {
            min-height: 100vh;
            margin: 0;
            background-color: black;
            color: white;
            text-align: center;
            font-family: "SB", sans-serif;
            display: flex;
            flex-direction: column;
        }
    </style>
    <link rel="icon" type="image/png" href="files/logo.png">
</head>

<body style="opacity: 1; transition: opacity 0.5s ease;">

    <div style="display: block; text-align: center; opacity: 0; max-height: 0px; overflow: hidden; transition: opacity 1s ease, max-height 1s ease;"
        id="logo">
        <img src="files/logo_padding.png" style="width: 270px; margin-top: 20px">
    </div>

    <div style="display: flex; width: 100%; min-height: 100vh; align-items: center; justify-content: center; transition: opacity 1s ease, min-height 1s ease; flex-direction: column; margin-bottom: 0; opacity: 0;"
        id="title">
        <h1 style="display: flex; text-align: center; font-family: SB; margin-bottom: 0;"> ACOPS
            <a style="display: none; max-width: 0px; overflow: hidden; opacity: 1; transition: opacity 0.5s ease, max-width 0.5s ease, color 0.5s ease; flex-direction: column; color: rgb(255, 255, 255);"
                id="kr">.KR</a>
        </h1>
    </div>
    <p style="margin-top: 0; display: none; opacity: 0; transition: opacity 0.5s ease;" id="proto">나에 대하여</p>

    <div style="display: none; opacity: 0; max-height: 0; overflow: hidden; transition: opacity 1s ease, max-height 1s ease;"
        id="main-dn">
        <br>
        <!-- 내용 -->
        <p>저는 중학교 2학년 학생 입니다<br>4학년 때 처음 C++ 코딩으로 시작해<br>현재 HTML, JAVA, C 언어를 하고 있습니다</p>
        <p>또한 리눅스 기반 서버도 운영 중에 있습니다<br>주력 배포판은 Arch Linux 입니다</p>
        <!-- 하단 바 -->
        <div style="display: flex; position: fixed; width: 100%; bottom: 0; left: 0; justify-content: center; flex-direction: column; background-color: black; transition: max-height 0.5s ease; max-height: 50px; overflow: hidden;"
            id="dbar"">
                <hr style=" width: 100%;">
            <p style="margin-top: 0;"><a onclick="goback()" style="text-decoration: underline;">홈페이지</p>
        </div>
    </div>

    <script>
        let wait = 1000;
        localStorage.setItem("downanimation", 0);

        document.getElementById("kr").style.color = "yellow";
        start();
        document.getElementById("kr").style.display = "block";

        document.getElementById("kr").style.maxWidth = "100px";
        function start() {

            if (localStorage.getItem("acops") == "goto") {
                localStorage.setItem("acops", "none");
                document.getElementById("title").style.opacity = "1";
                wait = 0;
            } else {
                setTimeout(() => {
                    document.getElementById("kr").style.opacity = "1";

                    document.getElementById("title").style.opacity = "1";
                }, 50);
            }



            setTimeout(() => {

                document.getElementById("kr").style.maxWidth = "0px";
                document.getElementById("kr").style.opacity = "0";
                document.getElementById("logo").style.display = "block";
                        const dummy1 = document.getElementById("logo").offsetHeight;
                        document.getElementById("main-dn").style.display = "block";
                        const dummy2 = document.getElementById("main-dn").offsetHeight;;
                        document.getElementById("proto").style.display = "block";

                setTimeout(() => {
                    document.getElementById("title").style.minHeight = "0vh";
                    document.getElementById("logo").style.maxHeight = "270px";
                    document.getElementById("proto").style.opacity = "1";
                    document.getElementById("kr").style.color = "white";
                    setTimeout(() => {
                        document.getElementById("main-dn").style.maxHeight = "1000px";
                        setTimeout(() => {
                            document.getElementById("logo").style.opacity = "1";
                            document.getElementById("main-dn").style.opacity = "1";
                            localStorage.setItem("acops", "none");
                        }, 500)
                    }, 500)

                }, 1000);

            }, wait);
        }

        function me() {
            document.getElementById("mediv").style.display = "block";
            document.getElementById("mediv").offsetHeight;
            document.getElementById("mebtn").style.opacity = "0";
            document.getElementById("mebtn").style.maxHeight = "0px";

            setTimeout(() => {
                document.getElementById("mebtn").style.display = "none";
                document.getElementById("mediv").style.maxHeight = "500px";
                document.getElementById("mediv").style.opacity = "1";
            }, 500);
        }

        function out() {
            document.body.style.opacity = "0";
        }

        function come() {
            document.body.style.opacity = "1";
        }

        function ignore() {
            localStorage.setItem("ignore", "true");
            out()
            setTimeout(() => {
                location.reload()
            }, 600);
        }

        function deb_reset_ignore() {
            localStorage.setItem("ignore", "false");
        }

        function goto(url) {
            out()
            setTimeout(() => {
                window.location.href = url;
                localStorage.setItem("redir", "1");
            }, 600);
        }

        function goback() {
            localStorage.setItem("acops", "backto");
            document.getElementById("main-dn").style.opacity = "0";
            document.getElementById("kr").style.color = "white";
            document.getElementById("logo").style.opacity = "0";
            setTimeout(() => {
                document.getElementById("logo").style.maxHeight = "0px";
                document.getElementById("main-dn").style.maxHeight = "0px";
                document.getElementById("title").style.minHeight = "100vh";
                document.getElementById("kr").style.color = "yellow";
                document.getElementById("proto").style.opacity = "0";
                setTimeout(() => {
                    localStorage.setItem("acops", "backto");
                    window.location = "index.html";
                }, 1000);
            }, 1000);
        }

        // 이 부분은 AI의 도움을 받았어요 (수정된 버전)

let yellowlink_value = 0;

function applyLinkColor() {
    // querySelectorAll("a") 대신 :not(#kr)을 붙여 #kr은 제외합니다.
    const atag = document.querySelectorAll("a:not(#kr)"); 
    setTimeout(() => {
        if (localStorage.getItem("yellowlink") === "true") {
            atag.forEach(a => {
                a.style.color = "yellow";
            });
            yellowlink_value = 1;
        } else {
            atag.forEach(a => {
                a.style.color = "white";
            });
            yellowlink_value = 0;
        }
    }, );
}

applyLinkColor();

function yellowlink() {
    if (localStorage.getItem("yellowlink") === "true") {
        localStorage.setItem("yellowlink", "false");
    } else {
        localStorage.setItem("yellowlink", "true");
    }
    applyLinkColor();
}
// 여기까지
    </script>
</body>

</html>
