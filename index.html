<!DOCTYPE html>
<html>

<head>
    <title>ACOPS.KR</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        @font-face {
            font-family: "SB";
            src: url('files/font/SBL.ttf') format(truetype);
        }

        a {
            color: rgb(255, 255, 255);
            cursor: pointer;
        }

        body {
            min-height: 100vh;
            margin: 0;
            background-color: black;
            color: white;
            text-align: center;
            font-family: "SB", sans-serif;
            display: flex;
            flex-direction: column;
        }
    </style>
    <link rel="icon" type="image/png" href="files/logo.png">
</head>

<body style="opacity: 1; transition: opacity 0.5s ease;">

    <div style="display: block; text-align: center; opacity: 0; max-height: 0px; overflow: hidden; transition: opacity 1s ease, max-height 1s ease;"
        id="logo">
        <img src="files/logo_padding.png" style="width: 270px; height: auto;">
    </div>

    <div style="display: flex; width: 100%; min-height: 100vh; align-items: center; justify-content: center; transition: opacity 1s ease, min-height 1s ease; flex-direction: column; margin-bottom: 0; opacity: 0;"
        id="title">
        <h1 style="display: flex; text-align: center; font-family: SB; margin-bottom: 0;">
            ACOPS
            <a style="display: none; max-width: 0px; overflow: hidden; opacity: 0; transition: opacity 0.5s ease, max-width 0.5s ease, color 0.5s ease; flex-direction: column; color: yellow;"
                id="kr">.KR</a>
        </h1>
    </div>
    <p style="margin-top: 0; display: none; opacity: 0; transition: opacity 0.5s ease;" id="proto">안녕하세요!</p>

    <div style="display: none; opacity: 0; max-height: 0; overflow: hidden; transition: opacity 1s ease, max-height 1s ease;"
        id="main-dn">

        <p style="margin-top: 0;">새로운 시작입니다! |
            #65.2
            |
            <a href="https://kaps.kr">KAPS.KR</a>
        </p>
        <br>
        <!-- 내용 -->
        <p>
            <a onclick="goto('settings.html')" style="text-decoration: underline;">
                사이트 설정
            </a>
        </p>
        <p><a onclick="acops()" style="text-decoration: underline;">에이콥스</a></p>
        <p>
            <a onclick="me()"
                style="opacity: 1; max-height: 80px; transition: opacity 0.5s ease, max-height 0.5s ease; overflow: hidden; margin-bottom: 0; display: inline-block; text-decoration: underline;"
                id="mebtn">ACOPS.KR 에 대하여</a>
        </p>


        <div style="display: none; opacity: 0; max-height: 0px; overflow: hidden; transition: opacity 1s ease, max-height 1s ease; margin-top: 0;"
            id="mediv">
            <h3 style="margin: 0;">사이트 정보</h3>
            <p>2026년 4월 28일<br>2학년 1학기 중간고사가 끝남을 기념하며 도메인을 구입했습니다</p>
            <p>2026년 5월 30일<br>여가시간에 이 사이트를 만들었습니다<br>그리고 아직도 개발이 진행중입니다</p>
            <p>
                <a style="color: red; text-decoration: underline;">이 사이트 제작에 AI 는 사용되지 않았습니다</a>
            </p>
        </div>
        <div
            style="display: flex; position: fixed; width: 100%; bottom: 0; left: 0; justify-content: center; flex-direction: column; background-color: black;">
            <div style="transition: max-height 0.5s ease; max-height: 80px; overflow: hidden;" id="dbar">
                <hr style="width: 100%;">
                <p style="margin-top: 0;" id="dbartxt"><a onclick="goto('contact.html')" style="text-decoration: underline;">연락처
                        정보</a> |
                    <a style="font-size: 20px; text-decoration: underline;" onclick="acops()">에이콥스</a> | <a
                        href="https://kaps.kr">이전 사이트</a>
                    <br>
                    
                </p>
                <p style="margin: 0; color: gray; padding: 0; font-size: 13px;" id="info"></p>
            </div>
        </div>
    </div>

    <script>
    if (localStorage.getItem("downanimation") === null) {
        localStorage.setItem("downanimation", "0");
    }

    let ign = localStorage.getItem("ignore");
    if (ign != "true") {
        localStorage.setItem("ignore", "false");
    }

    const isAppleWebkit = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1) ||
        (navigator.vendor && navigator.vendor.includes('Apple'));


    
    initACOPS();

    function initACOPS() {
        const acopsStatus = localStorage.getItem("acops");
        const titleElement = document.getElementById("title");
        const bodyElement = document.body;

        if (acopsStatus === "backto") {
            
            bodyElement.style.transition = "none";
            titleElement.style.transition = "none";

            bodyElement.style.opacity = "1";
            titleElement.style.opacity = "1";

            setTimeout(() => {
                bodyElement.style.transition = "opacity 0.5s ease";
                titleElement.style.transition = "opacity 0.5s ease, min-height 1s ease";
            }, 50);

        } else {
            if (localStorage.getItem("redir") == "1") {
                setTimeout(() => { come(); }, 50);
            } else {
                bodyElement.style.opacity = "1";
            }

            titleElement.style.transition = "opacity 1s ease, min-height 1s ease";
            setTimeout(() => {
                titleElement.style.opacity = "1";
            }, 50);
        }
    }

    window.addEventListener('load', function() {
        document.getElementById("kr").style.color = "yellow";
        
        let wait = (localStorage.getItem("acops") === "backto") ? 0 : 500;

        setTimeout(() => {
            document.getElementById("kr").style.display = "inline-block";

            setTimeout(() => {
                document.getElementById("kr").style.maxWidth = "100px";
                document.getElementById("kr").style.opacity = "1";

                setTimeout(() => {
                    document.getElementById("title").style.transition = "opacity 1s ease, min-height 1s ease";
                    document.getElementById("title").style.minHeight = "0vh";
                    document.getElementById("logo").style.display = "block";
                    document.getElementById("main-dn").style.display = "block";
                    document.getElementById("proto").style.display = "block";

                    setTimeout(() => {
                        document.getElementById("logo").style.maxHeight = "270px";
                        document.getElementById("proto").style.opacity = "1";
                        document.getElementById("kr").style.color = "white";
                        
                        setTimeout(() => {
                            document.getElementById("main-dn").style.maxHeight = "1000px";
                            setTimeout(() => {
                                document.getElementById("logo").style.opacity = "1";
                                document.getElementById("main-dn").style.opacity = "1";
                                localStorage.setItem("ignore", "false");
                                localStorage.setItem("acops", "none");
                                document.getElementById("dbar").style.maxHeight = "80px";
                            }, 500)
                        }, 500)

                    }, 50);

                }, 1000);
            }, 50);
        }, wait);

        if (isAppleWebkit) {
            ign = localStorage.getItem("ignore");
            if (ign == "false") {
                document.getElementById("info").innerHTML = "Apple 기기 환경 | 최적화되지 않음";
                document.getElementById("dbartxt").style.marginBottom = "0";
            }
        }
    });

    function me() {
        document.getElementById("dbar").style.maxHeight = "0px";
        document.getElementById("mediv").style.display = "block";
        document.getElementById("mediv").offsetHeight;
        document.getElementById("mebtn").style.opacity = "0";
        document.getElementById("mebtn").style.maxHeight = "0px";

        setTimeout(() => {
            document.getElementById("mebtn").style.display = "none";
            document.getElementById("mediv").style.maxHeight = "500px";
            document.getElementById("mediv").style.opacity = "1";
        }, 500);
    }

    function out() { document.body.style.opacity = "0"; }
    function come() { document.body.style.opacity = "1"; }

    function ignore() {
        localStorage.setItem("ignore", "true");
        out();
        setTimeout(() => { location.reload(); }, 600);
    }

    function goto(url) {
        out();
        setTimeout(() => {
            window.location.href = url;
            localStorage.setItem("redir", "1");
        }, 600);
    }

    function acops() {
        document.getElementById("main-dn").style.opacity = "0";
        document.getElementById("kr").style.color = "white";
        document.getElementById("logo").style.opacity = "0";
        setTimeout(() => {
            document.getElementById("logo").style.maxHeight = "0px";
            document.getElementById("main-dn").style.maxHeight = "0px";
            document.getElementById("title").style.minHeight = "100vh";
            document.getElementById("kr").style.color = "yellow";
            document.getElementById("proto").style.opacity = "0";
            setTimeout(() => {
                localStorage.setItem("acops", "goto");
                window.location = "acops.html";
            }, 1000);
        }, 1000);
    }

    let yellowlink_value = 0;

    function applyLinkColor() {
        const atag = document.querySelectorAll("a:not(#kr)");
        setTimeout(() => {
            const isYellow = localStorage.getItem("yellowlink") === "true";
            atag.forEach(a => {
                if (a.closest("#mediv")) return;
                if (isYellow) { a.style.color = "yellow"; } 
                else { a.style.color = "white"; }
            });
            yellowlink_value = isYellow ? 1 : 0;
        });
    }

    applyLinkColor();

    function yellowlink() {
        if (localStorage.getItem("yellowlink") === "true") {
            localStorage.setItem("yellowlink", "false");
        } else {
            localStorage.setItem("yellowlink", "true");
        }
        applyLinkColor();
    }
</script>

</body>

</html>
