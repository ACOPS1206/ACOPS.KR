<!DOCTYPE html>
<html>
    <head>
        <title>ACOPS.KR</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            @font-face {
                font-family: "SB";
                src: url('files/font/SBL.ttf') format(truetype);
            }

            a {
                color: rgb(255, 255, 255);
                cursor: pointer;
            }

            body {
                min-height: 100vh;
                margin: 0;
                background-color: black;
                color: white;
                text-align: center;
                font-family: "SB", sans-serif;
                display: flex;
                flex-direction: column;
            }
        </style>
    </head>

    <body style="opacity: 1; transition: opacity 0.5s ease;">

        <div style="display: none; justify-content: center; opacity: 0; max-height: 0px; overflow: hidden; transition: opacity 1s ease, max-height 1s ease;" id="logo">
            <img src="files/logo.png" style="width: 270px;">
        </div>

        <div style="display: flex; width: 100%; min-height: 100vh; align-items: center; justify-content: center; transition: opacity 0.5s ease, min-height 1s ease; flex-direction: column; margin-bottom: 0; opacity: 0;" id="title">
            <h1 style="display: flex; text-align: center; font-family: SB; margin-bottom: 0;">
                ACOPS
                <a style="display: none; max-width: 0px; overflow: hidden; opacity: 0; transition: opacity 0.5s ease, max-width 0.3s ease, color 0.5s ease; flex-direction: column; color: yellow;" id="kr">.KR</a>
            </h1>
        </div>
        <p style="margin-top: 0; display: none; opacity: 0; transition: opacity 0.5s ease;" id="proto">프로토타입</p>

        <div style="display: none; opacity: 0; max-height: 0; overflow: hidden; transition: opacity 1s ease, max-height 1s ease;" id="main-dn">
            <br>
            <p>새로운 시작입니다! |
                <a href="https://instagram.com/dev_acops">@dev_acops</a>
                |
                <a href="https://kaps.kr">KAPS.KR</a></p>
            <br>
            <p>
                <a onclick="me()" style="opacity: 1; max-height: 50px; transition: opacity 0.5s ease, max-height 0.5s ease; overflow: hidden; margin-bottom: 0; display: inline-block; text-decoration: underline;" id="mebtn">ACOPS.KR 에 대하여</a>
            </p>

            <div style="display: none; opacity: 0; max-height: 0px; overflow: hidden; transition: opacity 1s ease, max-height 1s ease; margin-top: 0;" id="mediv">
                <h3 style="margin: 0;">사이트 정보</h3>
                <p>2026년 4월 28일<br>2학년 1학기 중간고사가 끝남을 기념하며 도메인을 구입했습니다</p>
                <p>2026년 5월 30일<br>영재원 여가시간에 이 사이트를 만들었습니다<br>그리고 아직도 개발이 진행중입니다</p>
                <p>
                    <a style="color: red; text-decoration: underline;">이 사이트 제작에 AI 는 사용되지 않았습니다</a>
                </p>
            </div>
            <div style="display: flex; position: fixed; width: 100%; bottom: 0; left: 0; justify-content: center; flex-direction: column; background-color: black">
                <hr style="width: 100%;">
                <p style="margin-top: 0;"><a onclick="goto('contact.html')" style="text-decoration: underline;">연락처 정보</a> | <a style="font-size: 20px; text-decoration: underline;" onclick="acops()">ACOPS</a> | <a href="https://kaps.kr">이전 사이트</a></p>
            </div>
        </div>

        <script>
            let wait = 1000;
            let ign = localStorage.getItem("ignore");
            if(ign != "true"){
                localStorage.setItem("ignore", "false");
            }

            //이 부분은 AI 를 썼어요..
            const isAppleWebkit = /iPad|iPhone|iPod/.test(navigator.userAgent) || 
                              (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1) || 
                              (navigator.vendor && navigator.vendor.includes('Apple'));
            //여기까지

            start();
            
            function start() {
                if(localStorage.getItem("redir") == "1"){
                    document.body.style.opacity = "0";
                    setTimeout(() => {
                        come();
                    }, 50);
                } else {
                    document.body.style.opacity = "1";
                }
                if(localStorage.getItem("acops") == "backto"){
                    document.getElementById("title").style.opacity = "1";
                    wait = 0;
                } else {
                    setTimeout(() => {
                    document.getElementById("title").style.opacity = "1";
                }, 50);
                }
                
                setTimeout(() => {
                    document.getElementById("kr").style.display = "inline-block";

                    setTimeout(() => {
                        document.getElementById("kr").style.maxWidth = "100px";
                        document.getElementById("kr").style.opacity = "1";

                        setTimeout(() => {
                            document.getElementById("title").style.minHeight = "0vh";

                            document.getElementById("logo").style.display = "flex";
                            document.getElementById("logo").offsetHeight;
                            document.getElementById("main-dn").style.display = "block";
                            document.getElementById("main-dn").offsetHeight;
                            document.getElementById("proto").style.display = "block";

                            setTimeout(() => {
                                document.getElementById("logo").style.maxHeight = "270px";
                                document.getElementById("proto").style.opacity = "1";
                                document.getElementById("kr").style.color = "white";
                                setTimeout(() => {
                                    document.getElementById("main-dn").style.maxHeight = "1000px";
                                    setTimeout(() => {
                                        document.getElementById("logo").style.opacity = "1";
                                        document.getElementById("main-dn").style.opacity = "1";
                                        localStorage.setItem("ignore", "false");
                                        localStorage.setItem("acops", "none");
                                    }, 500)
                                }, 500)

                            }, 10);

                        }, 1000);
                    }, 50);
                }, wait);

                if(isAppleWebkit){
                    ign = localStorage.getItem("ignore");
                    if(ign == "false"){
                        document.getElementById("main-dn").innerHTML = "<h2 style='color:red'>경고</h2><p style='font-size: 15px'>현재 Apple 기기를 사용하고 계신 듯 합니다.<br>이 기기에서는 이 사이트가 제대로 작동하지 않습니다.<br><b>다른 기기를 사용하세요!</b></p><p><a onclick='ignore()' style='text-decoration: underline; cursor: pointer'>무시하고 방문하기</a></p>";
                    }
                }
            }

            function me() {
                document.getElementById("mediv").style.display = "block";
                document.getElementById("mediv").offsetHeight;
                document.getElementById("mebtn").style.opacity = "0";
                document.getElementById("mebtn").style.maxHeight = "0px";

                setTimeout(() => {
                    document.getElementById("mebtn").style.display = "none";
                    document.getElementById("mediv").style.maxHeight = "500px";
                    document.getElementById("mediv").style.opacity = "1";
                }, 500);
            }

            function out() {
                document.body.style.opacity = "0";
            }

            function come() {
                document.body.style.opacity = "1";
            }

            function ignore(){
                localStorage.setItem("ignore", "true");
                out()
                setTimeout(() => {
                    location.reload()
                }, 600);
            }

            function deb_reset_ignore(){
                localStorage.setItem("ignore", "false");
            }

            function goto(url){
                out()
                setTimeout(() => {
                    window.location.href = url;
                    localStorage.setItem("redir", "1");
                }, 600);
            }

            function acops(){
                document.getElementById("main-dn").style.opacity = "0";
                document.getElementById("kr").style.color = "white";
                document.getElementById("logo").style.opacity = "0";
                setTimeout(() => {
                    document.getElementById("logo").style.maxHeight = "0px";
                    document.getElementById("main-dn").style.maxHeight = "0px";
                    document.getElementById("title").style.minHeight = "100vh";
                    document.getElementById("kr").style.color = "yellow";
                    document.getElementById("proto").style.opacity = "0";
                    setTimeout(() => {
                        localStorage.setItem("acops", "goto");
                        window.location = "acops.html";
                    }, 1000);
                }, 1000);
            }
        </script>
    </body>

</html>
