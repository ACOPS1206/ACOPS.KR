<!DOCTYPE html>
<html>
    <head>
        <title>ACOPS.KR</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            @font-face {
                font-family: "SB";
                src: url('files/font/SBL.ttf') format(truetype);
            }

            a {
                color: rgb(255, 255, 255);
                cursor: pointer;
            }

            body {
                min-height: 100vh;
                margin: 0;
                background-color: black;
                color: white;
                text-align: center;
                font-family: "SB", sans-serif;
                display: flex;
                flex-direction: column;
            }
        </style>
    </head>

    <body style="opacity: 1; transition: opacity 0.5s ease;">

        <div style="display: none; justify-content: center; opacity: 0; max-height: 0px; overflow: hidden; transition: opacity 1s ease, max-height 1s ease;" id="logo">
            <img src="files/logo.png" style="width: 270px;">
        </div>

        <div style="display: flex; width: 100%; min-height: 100vh; align-items: center; justify-content: center; transition: opacity 1s ease, min-height 1s ease; flex-direction: column; margin-bottom: 0; opacity: 0;" id="title">
    <h1 style="display: flex; text-align: center; font-family: SB; margin-bottom: 0;"> ACOPS
        <a style="display: none; max-width: 0px; overflow: hidden; opacity: 1; transition: opacity 0.5s ease, max-width 0.3s ease, color 0.5s ease; flex-direction: column; color: rgb(255, 255, 255);" id="kr">.KR</a>
    </h1>
</div>
        <p style="margin-top: 0; display: none; opacity: 0; transition: opacity 0.5s ease;" id="proto">연락처</p>

        <div style="display: none; opacity: 0; max-height: 0; overflow: hidden; transition: opacity 1s ease, max-height 1s ease;" id="main-dn">
            <br>
            <!-- 내용 -->
            <p>일반 연락처<br>010-8143-1580<br>@dev_acops<br>@im_acops<br>admin@acops.kr</p>
            <p>비상 연락처<br>aecopse12@gmail.com<br>acops@kaps.kr</p>
                <!-- 하단 바 -->
            <div style="display: flex; position: fixed; width: 100%; bottom: 0; left: 0; justify-content: center; flex-direction: column; background-color: black; transition: max-height 0.5s ease; max-height: 50px; overflow: hidden;" id="dbar"">
                <hr style="width: 100%;">
                <p style="margin-top: 0;"><a onclick="goto('index.html')" style="text-decoration: underline;">홈페이지</p>
            </div>
        </div>

        <script>
            document.getElementById("kr").style.color = "yellow";
            start();
            document.getElementById("kr").style.display = "block";

            document.getElementById("kr").style.maxWidth = "100px";
            function start() {
                            setTimeout(() => {
                                document.getElementById("kr").style.opacity = "1";
                            
                            document.getElementById("title").style.opacity = "1";
                            }, 50);
                            
                            
                        setTimeout(() => {
                            document.getElementById("title").style.minHeight = "0vh";
                            
                            
                            document.getElementById("logo").style.display = "flex";
                            document.getElementById("logo").offsetHeight;
                            document.getElementById("main-dn").style.display = "block";
                            document.getElementById("main-dn").offsetHeight;
                            document.getElementById("proto").style.display = "block";

                            setTimeout(() => {
                                document.getElementById("logo").style.maxHeight = "270px";
                                document.getElementById("proto").style.opacity = "1";
                                document.getElementById("kr").style.color = "white";
                                setTimeout(() => {
                                    document.getElementById("main-dn").style.maxHeight = "1000px";
                                    setTimeout(() => {
                                        document.getElementById("logo").style.opacity = "1";
                                        document.getElementById("main-dn").style.opacity = "1";
                                    }, 500)
                                }, 500)

                            }, 10);

                        }, 1000);
                    }

            function me() {
                document.getElementById("mediv").style.display = "block";
                document.getElementById("mediv").offsetHeight;
                document.getElementById("mebtn").style.opacity = "0";
                document.getElementById("mebtn").style.maxHeight = "0px";

                setTimeout(() => {
                    document.getElementById("mebtn").style.display = "none";
                    document.getElementById("mediv").style.maxHeight = "500px";
                    document.getElementById("mediv").style.opacity = "1";
                }, 500);
            }

            function out() {
                document.body.style.opacity = "0";
            }

            function come() {
                document.body.style.opacity = "1";
            }

            function ignore(){
                localStorage.setItem("ignore", "true");
                out()
                setTimeout(() => {
                    location.reload()
                }, 600);
            }

            function deb_reset_ignore(){
                localStorage.setItem("ignore", "false");
            }

            function goto(url){
                out();
                document.getElementById("dbar").style.maxHeight = "0px";
                setTimeout(() => {
                    window.location.href = url;
                    localStorage.setItem("redir", "1");
                }, 600);
            }
            
        </script>
    </body>

</html>
